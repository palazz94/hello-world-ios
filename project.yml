name: HelloWorld
options:
  bundleIdPrefix: com.fpala
  deploymentTarget:
    iOS: "27.1"

packages:
  PADRoguelikeCore:
    path: Packages/PADRoguelikeCore

targets:
  HelloWorld:
    type: application
    platform: iOS
    sources:
      - path: HelloWorld
    dependencies:
      - package: PADRoguelikeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fpala.helloworld
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.9"