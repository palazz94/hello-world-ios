name: HelloWorld
options:
  bundleIdPrefix: com.fpala
  deploymentTarget:
    iOS: "16.0"

targets:
  HelloWorld:
    type: application
    platform: iOS
    sources:
      - path: HelloWorld
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fpala.helloworld
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"