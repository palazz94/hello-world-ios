name: PAD-lite
options:
  bundleIdPrefix: com.fpala
  deploymentTarget:
    iOS: "27.1"

packages:
  PADRoguelikeCore:
    path: Packages/PADRoguelikeCore

targets:
  PAD-lite:
    type: application
    platform: iOS
    sources:
      - path: PAD-lite
    dependencies:
      - package: PADRoguelikeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fpala.padlite
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.9"